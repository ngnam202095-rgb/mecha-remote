import org.gradle.api.artifacts.repositories.MavenArtifactRepository

def useMavenCentralMirror = { repositories ->
    repositories.withType(MavenArtifactRepository).configureEach { repository ->
        if (repository.url?.host in ['repo.maven.apache.org', 'repo1.maven.org']) {
            repository.setUrl('https://maven-central.storage-download.googleapis.com/maven2')
        }
    }
}

gradle.beforeSettings { settings ->
    useMavenCentralMirror(settings.pluginManagement.repositories)
    useMavenCentralMirror(settings.dependencyResolutionManagement.repositories)
}

gradle.beforeProject { project ->
    useMavenCentralMirror(project.buildscript.repositories)
    useMavenCentralMirror(project.repositories)
}
