name: AI repair mock tests

on:
  pull_request:
    paths:
      - '.github/workflows/repair-demo-tests.yml'
      - 'flutter/lib/desktop/pages/repair_demo_*.dart'
      - 'flutter/test/repair_demo_test.dart'
      - 'flutter/pubspec.*'

permissions:
  contents: read

jobs:
  flutter-mock:
    name: Flutter mocks (Windows)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - run: flutter test test/repair_demo_test.dart --reporter expanded
